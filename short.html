<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-lg">
    <h1 class="text-2xl font-bold mb-4">URL Shortener</h1>
    <input id="longURL" type="text" placeholder="Masukkan URL panjang..." class="w-full border p-2 rounded mb-3">
    <button onclick="shortenURL()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Shorten</button>
    <p id="result" class="mt-3 text-green-600 font-semibold"></p>
    <hr class="my-4">
    <h2 class="font-semibold mb-2">Daftar Short URL</h2>
    <div id="list" class="text-sm space-y-2"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwokOMpq9ulAI2ksMHDsW5HpHpXfNRyu4qqOmv1bPqOoZY5KvqQnPMrnYgvewHO6jJ2/exec";

    async function shortenURL() {
      const longURL = document.getElementById("longURL").value.trim();
      if (!longURL) return alert("Masukkan URL terlebih dahulu!");

      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ longURL }),
        headers: { "Content-Type": "application/json" }
      });
      const data = await res.json();
      document.getElementById("result").innerHTML = 
        `Short URL: <a href="${API_URL}?id=${data.shortCode}" target="_blank" class="text-blue-500 underline">${API_URL}?id=${data.shortCode}</a>`;
      loadList();
    }

    async function loadList() {
      const res = await fetch(API_URL);
      const data = await res.json();
      document.getElementById("list").innerHTML = data.map(d => 
        `<div class="p-2 border rounded">
          <a href="${API_URL}?id=${d.shortCode}" target="_blank" class="text-blue-500">${API_URL}?id=${d.shortCode}</a>
          <p class="text-gray-600 truncate">${d.longURL}</p>
          <span class="text-xs text-gray-500">Clicks: ${d.clicks || 0}</span>
        </div>`
      ).join("");
    }

    loadList();
  </script>
</body>
</html>
